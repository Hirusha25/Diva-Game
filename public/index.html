<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a4fb5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Diva Fresh Run</title>
  <link rel="stylesheet" href="css/game.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Heads-up display -->
  <div id="hud" class="hud hidden">
    <div class="hud-top">
      <div class="pill"><span class="label">Score</span><span id="hud-score">0</span></div>
      <div class="pill"><span class="label">Distance</span><span id="hud-distance">0 m</span></div>
      <div class="pill lives" id="hud-lives"></div>
    </div>
    <div id="hud-toast" class="toast"></div>
  </div>

  <!-- Loading -->
  <div id="screen-loading" class="screen">
    <div class="card">
      <h1 class="title">Diva Fresh<br><span>Stain Fighter Run</span></h1>
      <div class="bar"><div id="load-bar"></div></div>
      <p id="load-text">Loading world…</p>
    </div>
  </div>

  <!-- Register -->
  <div id="screen-register" class="screen hidden">
    <form class="card form" id="form-register" novalidate>
      <h1 class="title">Diva Fresh<br><span>Stain Fighter Run</span></h1>
      <p class="hint">Enter your details to play and win</p>
      <label class="field"><span>Your name</span><input id="reg-name" name="name" type="text" maxlength="40" autocomplete="name" required></label>
      <label class="field"><span>Mobile number</span><input id="reg-phone" name="phone" type="tel" inputmode="numeric" placeholder="07X XXX XXXX" autocomplete="tel" required></label>
      <p class="error" id="reg-error"></p>
      <button type="submit" id="btn-register" class="btn btn-start">SEND CODE</button>
    </form>
  </div>

  <!-- OTP -->
  <div id="screen-otp" class="screen hidden">
    <form class="card form" id="form-otp" novalidate>
      <h2 class="subtitle">Enter the code</h2>
      <p class="hint">We sent an SMS to <strong id="otp-phone"></strong></p>
      <label class="field"><span>4-digit code</span><input id="otp-code" name="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required></label>
      <p class="error" id="otp-error"></p>
      <button type="submit" id="btn-verify" class="btn btn-start">VERIFY</button>
      <div class="row">
        <button type="button" id="btn-resend" class="link">Resend code</button>
        <button type="button" id="btn-change" class="link">Change number</button>
      </div>
    </form>
  </div>

  <!-- Lobby -->
  <div id="screen-lobby" class="screen hidden">
    <div class="card">
      <h1 class="title">Diva Fresh<br><span>Stain Fighter Run</span></h1>
      <p class="hint" id="lobby-greeting">Swipe left / right to change lane · swipe up to jump</p>
      <button id="btn-start" class="btn btn-start">START</button>
      <div class="row"><button type="button" id="btn-signout" class="link">Not you? Change player</button></div>
    </div>
  </div>

  <!-- Game over -->
  <div id="screen-over" class="screen hidden">
    <div class="card">
      <h2 class="subtitle">Run over!</h2>
      <div class="final"><span class="label">Score</span><span id="final-score">0</span></div>
      <div class="final"><span class="label">Distance</span><span id="final-distance">0 m</span></div>
      <div class="final"><span class="label">Your best</span><span id="final-best">0</span></div>
      <p class="hint" id="final-rank"></p>
      <ol class="board" id="board"></ol>
      <button id="btn-retry" class="btn btn-start">RUN AGAIN</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
