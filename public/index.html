<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a4fb5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Diva Fresh Run</title>
  <link rel="stylesheet" href="css/game.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Heads-up display -->
  <div id="hud" class="hud hidden">
    <div class="hud-top">
      <div class="pill"><span class="label">Score</span><span id="hud-score">0</span></div>
      <div class="pill"><span class="label">Distance</span><span id="hud-distance">0 m</span></div>
      <div class="pill lives" id="hud-lives"></div>
    </div>
    <div id="hud-toast" class="toast"></div>
  </div>

  <!-- Loading -->
  <div id="screen-loading" class="screen">
    <div class="card">
      <h1 class="title">Diva Fresh<br><span>Stain Fighter Run</span></h1>
      <div class="bar"><div id="load-bar"></div></div>
      <p id="load-text">Loading world…</p>
    </div>
  </div>

  <!-- Lobby -->
  <div id="screen-lobby" class="screen hidden">
    <div class="card">
      <h1 class="title">Diva Fresh<br><span>Stain Fighter Run</span></h1>
      <p class="hint">Swipe left / right to change lane · swipe up to jump</p>
      <button id="btn-start" class="btn btn-start">START</button>
    </div>
  </div>

  <!-- Game over -->
  <div id="screen-over" class="screen hidden">
    <div class="card">
      <h2 class="subtitle">Run over!</h2>
      <div class="final"><span class="label">Score</span><span id="final-score">0</span></div>
      <div class="final"><span class="label">Distance</span><span id="final-distance">0 m</span></div>
      <button id="btn-retry" class="btn btn-start">RUN AGAIN</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
